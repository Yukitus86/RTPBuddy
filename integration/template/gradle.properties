# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Minecraft / Fabric
# These four must stay identical to RTPBuddy's gradle.properties. Two mods that
# are to run in one client are built against one Minecraft and one loader; a
# mismatch here is not caught at build time, only by the game refusing to start.
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.6
loader_version=0.19.3
fabric_version=0.141.6+1.21.11

# The RTPBuddy jar this mod compiles against, expected at
# libs/rtpbuddy-<this version>.jar
rtpbuddy_version=1.6.24

# Mod
mod_version=0.1.0
maven_group=dev.rtpcompanion
archives_base_name=rtpcompanion

# NOTE: build with JDK 21 (JAVA_HOME pointing at a Java 21 install).
